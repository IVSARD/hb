<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Для тебя ♥</title>
<meta property="og:title" content="Для тебя ♥">
<meta property="og:description" content="Открой меня">
<style>
  :root {
    --neon: #ff5fa2;
    --soft: #ffd1e6;
    --dark: #0b0207;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas#fx {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    pointer-events: none;
  }
  .stage {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    box-sizing: border-box;
  }
  svg#scene {
    width: min(88vw, 46vh, 400px);
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 0 3px rgba(255, 95, 162, 0.95))
            drop-shadow(0 0 12px rgba(255, 45, 120, 0.55));
  }
  /* Линии «рисуются» сами: у каждой pathLength = 1 */
  .line {
    fill: var(--dark);
    stroke: var(--neon);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    fill-opacity: 0;
    opacity: 0;
  }
  .line.thin { stroke-width: 3; }
  .line.open { fill: none; }
  .pop { opacity: 0; }
  /* Шаг включается касанием — анимации стартуют в момент .on */
  .step.on .line { animation: draw var(--t, 1.1s) ease-in-out var(--d, 0s) forwards; }
  .step.on .pop  { animation: pop 0.7s ease-out var(--d, 0s) forwards; }
  @keyframes draw {
    0%   { stroke-dashoffset: 1; opacity: 1; fill-opacity: 0; }
    70%  { fill-opacity: 0; }
    100% { stroke-dashoffset: 0; opacity: 1; fill-opacity: 1; }
  }
  @keyframes pop { to { opacity: 1; } }

  /* Ожил: моргает, виляет кончиком хвоста, дымок из чашки */
  body.alive .blink {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.8s ease-in-out 1s infinite;
  }
  @keyframes blink {
    0%, 91%, 97%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.08); }
  }
  body.alive .wag {
    transform-box: view-box;
    transform-origin: 138px 386px;
    animation: wag 3.4s ease-in-out infinite;
  }
  @keyframes wag {
    0%, 100% { transform: rotate(0deg); }
    35%      { transform: rotate(9deg); }
    70%      { transform: rotate(-6deg); }
  }
  body.alive .steam {
    animation: steam 3.2s ease-in-out infinite;
  }
  body.alive .steam.s2 { animation-delay: 1.6s; }
  @keyframes steam {
    0%   { opacity: 0; transform: translateY(0); }
    25%  { opacity: 0.9; }
    75%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-8px); }
  }
  /* «Мур» — волны от носика, когда его гладят */
  .purr circle {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
  }
  .purr.on circle {
    animation: pur 1.3s ease-out var(--d, 0s) 2;
  }
  @keyframes pur {
    0%   { opacity: 0.9; transform: scale(0.3); }
    100% { opacity: 0; transform: scale(1.5); }
  }

  #hint {
    position: fixed; left: 0; right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center;
    font: 500 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 170, 200, 0);
    text-shadow: none;
    transition: color 1.5s ease;
    pointer-events: none;
  }
  #hint.show { color: rgba(255, 170, 200, 0.7); }

  @media (orientation: landscape) and (max-height: 520px) {
    svg#scene { width: min(46vw, 86vh); }
    #hint { left: 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .step.on .line { animation: none; stroke-dashoffset: 0; opacity: 1; fill-opacity: 1; }
    .step.on .pop { animation: none; opacity: 1; }
    body.alive .blink, body.alive .wag, body.alive .steam { animation: none; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="stage">
  <svg id="scene" viewBox="0 0 360 640" role="img" aria-label="Котик у окна">
    <!-- невидимая рамка стёкол: снег идёт только за окном -->
    <rect id="glass" x="70" y="82" width="220" height="304" fill="none" pointer-events="none"/>

    <g class="step" id="s1">
      <!-- окно: рама, внутренняя рамка, перекрёст -->
      <path class="line open" d="M 58 78 Q 58 72 64 72 L 296 72 Q 302 72 302 78 L 302 398 L 58 398 Z" pathLength="1" style="--d:0s;--t:1.4s"/>
      <path class="line thin open" d="M 70 82 L 70 390 L 290 390 L 290 82 Z" pathLength="1" style="--d:1.0s;--t:1.0s"/>
      <path class="line thin open" d="M 180 82 L 180 390" pathLength="1" style="--d:1.8s;--t:0.5s"/>
      <path class="line thin open" d="M 70 240 L 290 240" pathLength="1" style="--d:2.2s;--t:0.4s"/>
      <!-- месяц в правом стекле, звёзды -->
      <path class="pop" d="M 245.6 116 A 24 24 0 1 0 266 151.6 A 21 21 0 1 1 245.6 116 Z" fill="#ffd1e6" style="--d:2.6s"/>
      <path class="pop" d="M 113 126 a 2.2 2.2 0 1 0 4.4 0 a 2.2 2.2 0 1 0 -4.4 0 Z" fill="#ffd1e6" style="--d:2.9s"/>
      <path class="pop" d="M 96 318 a 1.8 1.8 0 1 0 3.6 0 a 1.8 1.8 0 1 0 -3.6 0 Z" fill="#ffd1e6" style="--d:3.1s"/>
      <path class="pop" d="M 258 322 a 2 2 0 1 0 4 0 a 2 2 0 1 0 -4 0 Z" fill="#ffd1e6" style="--d:3.3s"/>
      <path class="pop" d="M 140 180 a 1.6 1.6 0 1 0 3.2 0 a 1.6 1.6 0 1 0 -3.2 0 Z" fill="#ffd1e6" style="--d:3.5s"/>
    </g>

    <g class="step" id="s3">
      <!-- подоконник -->
      <path class="line open" d="M 44 404 L 316 404" pathLength="1" style="--d:0s;--t:0.8s;stroke-width:5px"/>
      <path class="line thin open" d="M 52 404 L 52 416 L 308 416 L 308 404" pathLength="1" style="--d:0.7s;--t:0.7s"/>
      <!-- чашка с паром -->
      <path class="line thin" d="M 78 378 L 78 395 Q 78 404 87 404 L 95 404 Q 104 404 104 395 L 104 378 Z" pathLength="1" style="--d:1.3s;--t:0.6s"/>
      <path class="line thin open" d="M 104 383 Q 114 385 112 392 Q 110 398 104 397" pathLength="1" style="--d:1.9s;--t:0.4s"/>
      <path class="line thin open steam" d="M 85 370 Q 89 364 85 358 Q 81 352 85 346" pathLength="1" style="--d:2.3s;--t:0.5s"/>
      <path class="line thin open steam s2" d="M 94 370 Q 90 364 94 358 Q 98 352 94 346" pathLength="1" style="--d:2.5s;--t:0.5s"/>
    </g>

    <g class="step" id="s4">
      <g id="cat">
        <!-- тёмный силуэт: снег за котом, не сквозь него -->
        <path class="pop" d="M 208 298 L 214 274 L 230 290 Q 248 288 254 302 Q 258 312 252 318 Q 246 326 238 328 Q 234 352 237 374 Q 239 392 239 404 L 252 404 L 236 404 Q 218 403 204 397 Q 184 391 181 368 Q 178 342 193 329 Q 202 321 208 316 Q 210 306 208 298 Z" fill="var(--dark)" style="--d:3.4s"/>
        <!-- ухо -->
        <path class="line open" d="M 208 298 L 214 274 L 230 290" pathLength="1" style="--d:0.1s;--t:0.5s"/>
        <!-- голова → лоб → носик -->
        <path class="line open" d="M 230 290 Q 248 288 254 302 Q 258 312 252 318" pathLength="1" style="--d:0.5s;--t:0.5s"/>
        <!-- подбородок → шея -->
        <path class="line open" d="M 252 318 Q 246 326 238 328" pathLength="1" style="--d:0.9s;--t:0.3s"/>
        <!-- грудь → передняя лапа -->
        <path class="line open" d="M 238 328 Q 234 352 237 374 Q 239 392 239 404" pathLength="1" style="--d:1.1s;--t:0.6s"/>
        <!-- лапа вперёд -->
        <path class="line open" d="M 239 404 L 252 404" pathLength="1" style="--d:1.6s;--t:0.2s"/>
        <!-- внутренняя линия лапы -->
        <path class="line thin open" d="M 247 384 L 248 404" pathLength="1" style="--d:1.9s;--t:0.3s"/>
        <!-- живот -->
        <path class="line open" d="M 236 400 Q 218 403 204 397" pathLength="1" style="--d:2.1s;--t:0.4s"/>
        <!-- спина и бедро -->
        <path class="line" d="M 204 397 Q 184 391 181 368 Q 178 342 193 329 Q 202 321 208 316 Q 210 306 208 298" pathLength="1" style="--d:2.4s;--t:0.9s"/>
        <!-- задняя лапка -->
        <path class="line thin open" d="M 206 404 Q 210 396 205 390" pathLength="1" style="--d:3.1s;--t:0.3s"/>
        <!-- хвост обвивает лапы сзади -->
        <path class="line open wag" d="M 188 392 C 176 401 160 404 148 402 C 138 400 135 392 141 386" pathLength="1" style="--d:3.3s;--t:0.6s;stroke-width:5px"/>
      </g>
    </g>

    <g class="step" id="s5">
      <!-- глаз, носик, усы — открывает глаза -->
      <g class="blink">
        <path class="pop" d="M 238 300 a 2.6 2.6 0 1 0 5.2 0 a 2.6 2.6 0 1 0 -5.2 0 Z" fill="#ffd1e6" style="--d:0.4s"/>
      </g>
      <path class="pop" d="M 253 308 a 1.5 1.5 0 1 0 3 0 a 1.5 1.5 0 1 0 -3 0 Z" fill="#ff7ab4" style="--d:0.6s"/>
      <path class="line thin open" d="M 250 307 L 272 301" pathLength="1" style="--d:0.8s;--t:0.3s"/>
      <path class="line thin open" d="M 250 311 L 270 313" pathLength="1" style="--d:1.0s;--t:0.3s"/>
      <!-- румянец -->
      <path class="pop" d="M 228 314 a 5 3.2 0 1 0 10 0 a 5 3.2 0 1 0 -10 0 Z" fill="rgba(255,70,140,0.4)" style="--d:1.2s"/>
      <!-- «мур»-волны у носика -->
      <g class="purr" id="purr">
        <circle cx="268" cy="308" r="10" fill="none" stroke="rgba(255,209,230,0.8)" stroke-width="1.5" style="--d:0s"/>
        <circle cx="268" cy="308" r="14" fill="none" stroke="rgba(255,209,230,0.6)" stroke-width="1.5" style="--d:0.15s"/>
        <circle cx="268" cy="308" r="18" fill="none" stroke="rgba(255,209,230,0.4)" stroke-width="1.5" style="--d:0.3s"/>
      </g>
    </g>
  </svg>
</main>
<div id="hint">коснись ♡</div>
<script>
(() => {
  const svg = document.getElementById("scene");
  const hint = document.getElementById("hint");
  const purr = document.getElementById("purr");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ——— Фон: снег за окном, искры, сердечки в финале ———
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  const glassEl = document.getElementById("glass");
  let W = 0, H = 0, DPR = 1, glass = null;
  let flakes = [], sparks = [], floaters = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = glassEl.getBoundingClientRect();
    glass = { x: g.left, y: g.top, w: g.width, h: g.height };
    if (snowOn) seedSnow();
  }
  function newFlake(anywhere) {
    return {
      x: glass.x + Math.random() * glass.w,
      y: anywhere ? glass.y + Math.random() * glass.h : glass.y - 4,
      vy: 18 + Math.random() * 38,
      drift: Math.random() * Math.PI * 2,
      dSpd: 0.5 + Math.random() * 1.2,
      size: 1.4 + Math.random() * 2.4,
      alpha: 0.65 + Math.random() * 0.35,
    };
  }
  function seedSnow() {
    const n = Math.round(Math.min(170, (glass.w * glass.h) / 230));
    flakes = Array.from({ length: n }, () => newFlake(true));
  }
  function newFloater(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 20,
      vy: 0.15 + Math.random() * 0.35,
      sway: Math.random() * Math.PI * 2,
      size: 8 + Math.random() * 14,
      alpha: 0.06 + Math.random() * 0.2,
    };
  }
  function burst(x, y, count = 26) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.5 + Math.random() * 4;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
                    life: 1, size: 10 + Math.random() * 16 });
    }
  }

  let snowOn = false;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last) * 0.06;
    last = now;
    ctx.clearRect(0, 0, W, H);
    if (snowOn && glass) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(glass.x, glass.y, glass.w, glass.h);
      ctx.clip();
      for (const f of flakes) {
        f.y += f.vy * dt * 0.016 * 60 / 60;
        f.drift += 0.03 * dt;
        if (f.y > glass.y + glass.h + 4) Object.assign(f, newFlake(false));
        ctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
        ctx.beginPath();
        ctx.arc(f.x + Math.sin(f.drift) * 6, f.y, f.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (floaters.length) {
      // сердечки — в комнате, не сквозь стёкла
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      if (glass) ctx.rect(glass.x, glass.y, glass.w, glass.h);
      ctx.clip("evenodd");
      for (const f of floaters) {
        f.y -= f.vy * dt;
        f.sway += 0.02 * dt;
        if (f.y < -20) Object.assign(f, newFloater(false));
        ctx.font = `${f.size}px sans-serif`;
        ctx.fillStyle = `rgba(255, 95, 162, ${f.alpha})`;
        ctx.fillText("♥", f.x + Math.sin(f.sway) * 12, f.y);
      }
      ctx.restore();
    }
    for (const s of sparks) {
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vy += 0.08 * dt; s.life -= 0.012 * dt;
      ctx.font = `${s.size}px sans-serif`;
      ctx.fillStyle = `rgba(255, 90, 140, ${Math.max(0, s.life)})`;
      ctx.fillText("♥", s.x, s.y);
    }
    sparks = sparks.filter((s) => s.life > 0);
    requestAnimationFrame(frame);
  }

  // ——— Поэтапная сборка: касание добавляет кусочек ———
  const HINTS = ["коснись ♡", "ещё ♡", "и ещё ♡", "смотри...", "погладь его ♡"];
  let step = 0;
  let alive = false;

  function setHint(text) {
    hint.classList.remove("show");
    setTimeout(() => { hint.textContent = text; hint.classList.add("show"); }, 350);
  }

  function activate(id) {
    document.getElementById(id).classList.add("on");
  }

  function next() {
    step++;
    if (step === 1) {
      activate("s1");
      setHint(HINTS[1]);
    } else if (step === 2) {
      snowOn = true;
      seedSnow();
      setHint(HINTS[2]);
    } else if (step === 3) {
      activate("s3");
      setHint(HINTS[3]);
    } else if (step === 4) {
      activate("s4");
      setHint("...");
    } else if (step === 5) {
      activate("s5");
      finale();
    }
  }

  function finale() {
    alive = true;
    const box = svg.getBoundingClientRect();
    const k = box.width / 360;
    setTimeout(() => {
      document.body.classList.add("alive");
      burst(box.left + 230 * k, box.top + 330 * k, 30);
      if (navigator.vibrate) navigator.vibrate(25);
      setHint(HINTS[4]);
      setTimeout(() => hint.classList.remove("show"), 3200);
      // сердечки фоном — как в прошлом подарке
      const n = Math.round(Math.min(34, (W * H) / 22000));
      floaters = Array.from({ length: n }, () => newFloater(true));
    }, reduce ? 0 : 900);
  }

  // Касание: до финала — следующий кусочек; после — кот мурчит или искры
  window.addEventListener("pointerdown", (e) => {
    if (!alive) { next(); return; }
    const box = svg.getBoundingClientRect();
    const k = box.width / 360;
    const cx = (e.clientX - box.left) / k;
    const cy = (e.clientY - box.top) / k;
    const onCat = cx >= 170 && cx <= 275 && cy >= 265 && cy <= 415;
    if (onCat) {
      purr.classList.remove("on");
      void purr.getBoundingClientRect();
      purr.classList.add("on");
      burst(box.left + 245 * k, box.top + 310 * k, 10);
      if (navigator.vibrate) navigator.vibrate(30);
    } else {
      burst(e.clientX, e.clientY, 18);
    }
  });
  window.addEventListener("resize", resize);

  resize();
  requestAnimationFrame(frame);
  setTimeout(() => hint.classList.add("show"), 800);
})();
</script>
</body>
</html>
